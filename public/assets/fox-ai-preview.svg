  <text x="60" y="395" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cbd5e1">📐 图像比例</text>
  <rect x="60" y="405" width="190" height="42" rx="10" fill="#f97316" opacity="0.15" stroke="#f97316"/>
  <text x="120" y="423" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f97316">1 : 1</text>
  <text x="105" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#f97316">1024 × 1024</text>

  <rect x="275" y="405" width="190" height="42" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="335" y="423" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">3 : 4</text>
  <text x="320" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">768 × 1024</text>

  <rect x="490" y="405" width="190" height="42" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="550" y="423" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">4 : 3</text>
  <text x="535" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">1024 × 768</text>

  <!-- Generate Button -->
  <rect x="60" y="475" width="620" height="50" rx="14" fill="url(#brand-grad)"/>
  <text x="300" y="506" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">✨ 立即开始智能绘制 (100% 免 Key 运行)</text>

  <text x="60" y="565" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">系统特点: 支持 Cloudflare Workers/Pages 边缘零成本部署 | 自动持久化本地历史记录 | 支持中英双向AI翻译</text>

  <!-- Right Panel: Result Preview & Art Display -->
  <rect x="720" y="110" width="440" height="525" rx="20" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <text x="740" y="135" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#cbd5e1">🖼️ 实时绘图工作台预览</text>
  <text x="1080" y="135" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">🟢 绘制就绪</text>

  <!-- Artwork Canvas -->
  <rect x="740" y="150" width="400" height="400" rx="16" fill="#020617" stroke="#1e293b"/>
  <!-- Decorative AI Generated Artwork Canvas Graphic -->
  <circle cx="940" cy="330" r="140" fill="#f97316" opacity="0.3"/>
  <polygon points="940,230 1020,380 860,380" fill="#ea580c" opacity="0.6"/>
  <circle cx="940" cy="310" r="35" fill="#fef08a"/>
  <path d="M 800 480 Q 940 400 1080 480 L 1080 550 L 800 550 Z" fill="#1e1b4b"/>
  <text x="940" y="320" font-family="system-ui, sans-serif" font-size="64" text-anchor="middle" fill="#ffffff">🦊</text>
  <text x="940" y="520" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f8fafc">狐AI - 国风赛博极清海报</text>

  <!-- Action Bar -->
  <rect x="740" y="565" width="190" height="38" rx="10" fill="#1e293b"/>
  <text x="795" y="589" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">📥 下载高清原图</text>
  <rect x="950" y="565" width="190" height="38" rx="10" fill="#1e293b"/>
  <text x="1005" y="589" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">🔄 一键同款生图</text>

</svg>
