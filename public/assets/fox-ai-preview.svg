  <text x="75" y="250" font-family="monospace" font-size="12" fill="#f1f5f9">Cyberpunk fox warrior in golden armor, neon city, chinese poster style,</text>
  <text x="75" y="270" font-family="monospace" font-size="12" fill="#f1f5f9">8k resolution, masterpiece, highly detailed, octane render, cinematic lighting</text>

