  <!-- Top Header Mockup -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="45" width="30" height="30" rx="8" fill="url(#brand-grad)"/>
  <text x="68" y="66" font-family="system-ui, sans-serif" font-size="18" fill="#ffffff">🦊</text>
  <text x="100" y="66" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="url(#brand-grad)">狐AI (Fox AI)</text>
  <text x="210" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">极简高颜值 AI 绘图创作工作台 • Edge Native</text>

  <!-- Navigation Tabs Mockup -->
  <rect x="750" y="43" width="390" height="34" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <rect x="755" y="46" width="70" height="28" rx="8" fill="#f97316" opacity="0.2"/>
  <text x="765" y="64" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#f97316">🎨 文生图</text>
  <text x="840" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">🖼️ 图生图</text>
  <text x="910" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">📦 模型库</text>
  <text x="980" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">💬 AI翻译</text>
  <text x="1055" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">⚙️ 设置</text>

