  <text x="152" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">日系动漫</text>
  <rect x="220" y="340" width="70" height="28" rx="8" fill="#1e293b"/>
  <text x="232" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">写实人像</text>
  <rect x="300" y="340" width="70" height="28" rx="8" fill="#1e293b"/>
  <text x="312" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">赛博朋克</text>
  <rect x="380" y="340" width="70" height="28" rx="8" fill="#1e293b"/>
  <text x="392" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">3D皮克斯</text>

