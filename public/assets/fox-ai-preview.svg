  <!-- Active Model Selector -->
  <rect x="60" y="130" width="620" height="60" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <rect x="75" y="142" width="36" height="36" rx="8" fill="#3b82f6" opacity="0.3"/>
  <text x="85" y="165" font-family="system-ui, sans-serif" font-size="16" fill="#3b82f6">⚡</text>
  <text x="125" y="152" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">SDXL Lightning (极速极清版)</text>
  <text x="125" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">● 免 Key 极速算力 (Cloudflare Workers AI Binding)</text>
  <rect x="580" y="145" width="80" height="30" rx="8" fill="#334155"/>
